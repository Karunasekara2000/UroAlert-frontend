<div class="p-4">
  <h2>Dashboard</h2>
  <div class="row mb-4">
    <!-- Stat card 1 -->
    <div class="col-12 col-md-4 mb-3">
      <div class="card p-3">
        <h5>New Patients</h5>
        <p class="display-6">1,925 <span class="text-success">+201</span></p>
      </div>
    </div>
    <!-- Stat card 2 -->
    <div class="col-12 col-md-4 mb-3">
      <div class="card p-3">
        <h5>Total Reports</h5>
        <p class="display-6">153 <span class="text-success">+28</span></p>
      </div>
    </div>
    <!-- Chart placeholder -->
    <div class="col-12 col-md-4 mb-3">
      <div class="card p-3">
        <h5>UTI Severity Chart</h5>
        <!-- Replace the placeholder div with a canvas element -->
        <canvas #utiSeverityChart style="height: 150px;"></canvas>
      </div>
    </div>
  </div>

  <h3>Patient Data</h3>
  <div class="card p-3">
    <table class="table table-hover">
      <thead>
      <tr>
        <th>Patient Name</th>
        <th>Date</th>
        <th>Symptoms</th>
        <th>Status</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td>Jenny Wilson</td>
        <td>Dec 18, 2021</td>
        <td>Dysuria</td>
        <td><span class="badge bg-success">Confirmed</span></td>
      </tr>
      <tr>
        <td>Albert Flores</td>
        <td>Dec 18, 2021</td>
        <td>Burning feeling</td>
        <td><span class="badge bg-primary">Incoming</span></td>
      </tr>
      <tr>
        <td>Floyd Miles</td>
        <td>Dec 18, 2021</td>
        <td>Passing small amounts</td>
        <td><span class="badge bg-warning text-dark">Pending</span></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
