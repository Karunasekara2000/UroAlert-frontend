<aside class="sidebar d-flex flex-column p-3">
  <!-- Logo -->
  <div class="logo-container text-center mb-3">
    <img src="assets/images/logo.png" alt="Logo" class="logo"/>
  </div>

  <!-- Group the hr + menu inside a container -->
  <div class="menu-section">
    <hr class="sidebar-divider" />

    <!-- Navigation Links -->
    <nav class="nav flex-column">
      <a class="nav-link d-flex align-items-center" routerLink="/dashboard">
        <i class="bi bi-grid nav-icon"></i>
        <span class="nav-text">Dashboard</span>
      </a>
      <a class="nav-link d-flex align-items-center" routerLink="/patient-management">
        <i class="bi bi-person-vcard nav-icon"></i>
        <span class="nav-text">Patient Management</span>
      </a>
      <a class="nav-link d-flex align-items-center" routerLink="/patient-record">
        <i class="bi bi-file-medical nav-icon"></i>
        <span class="nav-text">Patient Records</span>
      </a>
      <a class="nav-link d-flex align-items-center" routerLink="/settings">
        <i class="bi bi-person-gear nav-icon"></i>
        <span class="nav-text">User</span>
      </a>
    </nav>

    <hr class="sidebar-divider" />
  </div>

  <!-- Logout pinned to bottom -->
  <div class="logout-container mt-auto">
    <button class="btn btn-link logout-btn" (click)="logout()" style="text-decoration: none;">
      <i class="bi bi-box-arrow-right"></i>
      <span>Log out</span>
    </button>
  </div>
</aside>
